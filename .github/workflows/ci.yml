name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (uv)
        run: uv sync --frozen --extra test
      - name: Run Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -v --cov=memento --cov-report=xml 2>&1 | tee pytest.log
          # Fail if pytest exited before printing its complete summary (e.g. os._exit).
          grep -Eq '[0-9]+ (passed|failed|error|errors|skipped)' pytest.log

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (uv)
        run: uv sync --frozen --extra test
      - name: Run Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -v --cov=memento --cov-report=xml 2>&1 | tee pytest.log
          # Fail if pytest exited before printing its complete summary (e.g. os._exit).
          grep -Eq '[0-9]+ (passed|failed|error|errors|skipped)' pytest.log

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (uv)
        run: uv sync --frozen --extra test
      - name: Run Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -v --cov=memento --cov-report=xml 2>&1 | tee pytest.log
          # Fail if pytest exited before printing its complete summary (e.g. os._exit).
          grep -Eq '[0-9]+ (passed|failed|error|errors|skipped)' pytest.log
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.4.0,<0.5"
      - run: ruff check .
      - run: ruff format --check .
